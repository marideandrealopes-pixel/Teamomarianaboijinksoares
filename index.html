<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EU TE AMO 🐒💗</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    overflow: hidden;
    background: #16051f;
    font-family: "Comic Sans MS", cursive;
    color: white;
}

.sky {
    position: fixed;
    inset: 0;
    background:
        radial-gradient(circle at 50% 80%, #ff72c8 0%, #8c36c7 25%, #30105c 55%, #10051b 100%);
    overflow: hidden;
}

/* ESTRELAS */

.star {
    position: absolute;
    color: white;
    animation: pisca 1.5s infinite alternate;
    text-shadow: 0 0 10px white;
}

@keyframes pisca {
    from { opacity: .2; transform: scale(.6); }
    to { opacity: 1; transform: scale(1.3); }
}

/* CONTEÚDO */

.content {
    position: relative;
    z-index: 5;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 25px;
}

.pequeno {
    font-size: 17px;
    letter-spacing: 4px;
    color: #ffd6f5;
    text-shadow: 0 0 10px #ff4fc3;
    animation: aparecer 2s forwards;
}

h1 {
    margin: 10px 0;
    font-size: clamp(50px, 10vw, 110px);
    color: #fff;
    text-shadow:
        0 0 5px white,
        0 0 20px #ff7bd5,
        0 0 40px #ff22bb,
        0 0 80px #ff00aa;
    animation: pular 2s infinite alternate;
}

@keyframes pular {
    from { transform: scale(1); }
    to { transform: scale(1.04); }
}

.texto {
    max-width: 700px;
    font-size: 21px;
    line-height: 1.6;
    text-shadow: 0 0 8px #000;
}

.texto strong {
    color: #ffd1f3;
    font-size: 27px;
}

button {
    margin-top: 25px;
    padding: 17px 35px;
    border: 3px solid #fff;
    border-radius: 50px;
    background: linear-gradient(45deg, #ff38bb, #a855f7);
    color: white;
    font-family: inherit;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    box-shadow:
        0 0 10px white,
        0 0 30px #ff38bb;
    transition: .3s;
}

button:hover {
    transform: scale(1.15) rotate(-2deg);
}

/* CORAÇÕES */

.heart {
    position: fixed;
    bottom: -50px;
    z-index: 2;
    animation: subir linear forwards;
    pointer-events: none;
}

@keyframes subir {
    0% {
        transform: translateY(0) rotate(0deg) scale(.5);
        opacity: 0;
    }

    15% {
        opacity: 1;
    }

    100% {
        transform: translateY(-110vh) rotate(30deg) scale(1.5);
        opacity: 0;
    }
}

/* MACAQUINHOS */

.monkey {
    position: fixed;
    width: 130px;
    z-index: 4;
    animation: macaquinho 8s ease-in-out infinite;
    filter: drop-shadow(0 0 10px rgba(255,255,255,.4));
}

.monkey.left {
    left: 3%;
    bottom: 8%;
    animation-delay: 0s;
}

.monkey.right {
    right: 3%;
    top: 12%;
    animation-delay: 2s;
}

.monkey.middle {
    left: 50%;
    bottom: 2%;
    transform: translateX(-50%);
    animation-delay: 1s;
}

@keyframes macaquinho {
    0%,100% {
        transform: translateY(0) rotate(-5deg);
    }

    50% {
        transform: translateY(-25px) rotate(5deg);
    }
}

.monkey.middle {
    animation-name: macaquinhoCentro;
}

@keyframes macaquinhoCentro {
    0%,100% {
        transform: translateX(-50%) translateY(0) rotate(-5deg);
    }

    50% {
        transform: translateX(-50%) translateY(-20px) rotate(5deg);
    }
}

/* CANVAS DOS FOGOS */

canvas {
    position: fixed;
    inset: 0;
    z-index: 10;
    pointer-events: none;
}
</style>
</head>

<body>

<div class="sky" id="sky"></div>

<canvas id="fogos"></canvas>


<!-- MACAQUINHO 1 -->

<svg class="monkey left"
     viewBox="0 0 200 200">

    <!-- orelhas -->
    <circle cx="55" cy="65" r="30" fill="#9b5a32"/>
    <circle cx="145" cy="65" r="30" fill="#9b5a32"/>

    <!-- cabeça -->
    <circle cx="100" cy="85" r="65" fill="#a9683d"/>

    <!-- rosto -->
    <ellipse cx="100" cy="100" rx="48" ry="42" fill="#d69a68"/>

    <!-- olhos -->
    <circle cx="78" cy="82" r="7" fill="#20130e"/>
    <circle cx="122" cy="82" r="7" fill="#20130e"/>

    <!-- brilho -->
    <circle cx="76" cy="79" r="2" fill="white"/>
    <circle cx="120" cy="79" r="2" fill="white"/>

    <!-- nariz -->
    <ellipse cx="100" cy="98" rx="8" ry="6" fill="#5d301e"/>

    <!-- sorriso -->
    <path d="M75 112 Q100 140 125 112"
          fill="none"
          stroke="#542515"
          stroke-width="6"
          stroke-linecap="round"/>

    <!-- coração -->
    <text x="76" y="178"
          font-size="42">💗</text>
</svg>


<!-- MACAQUINHO 2 -->

<svg class="monkey right"
     viewBox="0 0 200 200">

    <circle cx="55" cy="65" r="30" fill="#9b5a32"/>
    <circle cx="145" cy="65" r="30" fill="#9b5a32"/>

    <circle cx="100" cy="85" r="65" fill="#a9683d"/>

    <ellipse cx="100" cy="100"
             rx="48"
             ry="42"
             fill="#d69a68"/>

    <circle cx="78" cy="82" r="7" fill="#20130e"/>
    <circle cx="122" cy="82" r="7" fill="#20130e"/>

    <circle cx="76" cy="79" r="2" fill="white"/>
    <circle cx="120" cy="79" r="2" fill="white"/>

    <ellipse cx="100" cy="98"
             rx="8"
             ry="6"
             fill="#5d301e"/>

    <path d="M75 112 Q100 140 125 112"
          fill="none"
          stroke="#542515"
          stroke-width="6"
          stroke-linecap="round"/>

    <text x="76" y="178"
          font-size="42">💜</text>
</svg>


<!-- MACAQUINHO DO CASAL -->

<svg class="monkey middle"
     viewBox="0 0 200 200">

    <circle cx="55" cy="65" r="30" fill="#9b5a32"/>
    <circle cx="145" cy="65" r="30" fill="#9b5a32"/>

    <circle cx="100" cy="85" r="65" fill="#a9683d"/>

    <ellipse cx="100" cy="100"
             rx="48"
             ry="42"
             fill="#d69a68"/>

    <circle cx="78" cy="82" r="7" fill="#20130e"/>
    <circle cx="122" cy="82" r="7" fill="#20130e"/>

    <circle cx="76" cy="79" r="2" fill="white"/>
    <circle cx="120" cy="79" r="2" fill="white"/>

    <ellipse cx="100" cy="98"
             rx="8"
             ry="6"
             fill="#5d301e"/>

    <path d="M75 112 Q100 140 125 112"
          fill="none"
          stroke="#542515"
          stroke-width="6"
          stroke-linecap="round"/>

    <text x="62" y="175"
          font-size="48">💞</text>
</svg>


<div class="content">

    <div class="pequeno">
        ATENÇÃO, MEU AMOR 💌
    </div>

    <h1>
        EU TE AMO 💗
    </h1>

    <div class="texto">

        Você é simplesmente a minha pessoa favorita
        nesse planeta inteiro. 🌎💜

        <br><br>

        Se eu pudesse escolher alguém para amar
        em todas as vidas possíveis...

        <br>

        <strong>
            eu escolheria você em todas elas. 🥹💗
        </strong>

        <br><br>

        E esses macaquinhos aqui são testemunhas
        oficiais desse amor. 🐒🐒💍
    </div>

    <button onclick="finale()">
        💕 CLIQUE AQUI, MEU AMOR 💕
    </button>

</div>


<script>

/* ESTRELAS */

const sky = document.getElementById("sky");

for(let i = 0; i < 150; i++){

    const estrela = document.createElement("div");

    estrela.className = "star";

    estrela.innerHTML =
        Math.random() > .5 ? "✦" : "·";

    estrela.style.left =
        Math.random() * 100 + "%";

    estrela.style.top =
        Math.random() * 100 + "%";

    estrela.style.fontSize =
        (8 + Math.random() * 15) + "px";

    estrela.style.animationDelay =
        Math.random() * 3 + "s";

    sky.appendChild(estrela);
}


/* CORAÇÕES */

function criarCoracao(){

    const heart = document.createElement("div");

    heart.className = "heart";

    const tipos = [
        "💗","💖","💘","💝",
        "💕","💞","💓","💜"
    ];

    heart.innerHTML =
        tipos[Math.floor(Math.random()*tipos.length)];

    heart.style.left =
        Math.random()*100 + "vw";

    heart.style.fontSize =
        (15 + Math.random()*30) + "px";

    heart.style.animationDuration =
        (5 + Math.random()*5) + "s";

    document.body.appendChild(heart);

    setTimeout(() => heart.remove(), 11000);
}

setInterval(criarCoracao, 450);


/* FOGOS */

const canvas =
    document.getElementById("fogos");

const ctx =
    canvas.getContext("2d");

function resize(){

    canvas.width =
        window.innerWidth;

    canvas.height =
        window.innerHeight;
}

resize();

window.addEventListener(
    "resize",
    resize
);

let foguetes = [];
let particulas = [];


function lancar(x,y){

    foguetes.push({

        x:x,

        y:canvas.height,

        alvo:y,

        velocidade:8,

        cor:
        `hsl(${Math.random()*360},100%,70%)`
    });
}


function explodir(x,y,cor){

    for(let i=0;i<130;i++){

        const angulo =
            Math.random()*Math.PI*2;

        const velocidade =
            Math.random()*7+2;

        particulas.push({

            x:x,
            y:y,

            vx:
            Math.cos(angulo)*velocidade,

            vy:
            Math.sin(angulo)*velocidade,

            vida:100,

            cor:cor,

            tamanho:
            Math.random()*3+1
        });
    }
}


function animar(){

    ctx.fillStyle =
        "rgba(22,5,31,.20)";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    foguetes.forEach((f,i)=>{

        f.y -= f.velocidade;

        ctx.beginPath();

        ctx.arc(
            f.x,
            f.y,
            3,
            0,
            Math.PI*2
        );

        ctx.fillStyle = f.cor;

        ctx.fill();

        if(f.y <= f.alvo){

            explodir(
                f.x,
                f.y,
                f.cor
            );

            foguetes.splice(i,1);
        }
    });


    particulas.forEach((p,i)=>{

        p.x += p.vx;
        p.y += p.vy;

        p.vy += .04;

        p.vx *= .98;
        p.vy *= .98;

        p.vida--;

        ctx.globalAlpha =
            p.vida/100;

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            p.tamanho,
            0,
            Math.PI*2
        );

        ctx.fillStyle = p.cor;

        ctx.fill();

        ctx.globalAlpha = 1;

        if(p.vida <= 0){

            particulas.splice(i,1);
        }
    });

    requestAnimationFrame(animar);
}

animar();


/* GRANDE FINAL */

function finale(){

    for(let i=0;i<25;i++){

        setTimeout(()=>{

            lancar(

                80 +
                Math.random()*
                (window.innerWidth-160),

                80 +
                Math.random()*
                (window.innerHeight*.55)
            );

        },i*250);
    }


    setTimeout(()=>{

        const final =
        document.createElement("div");

        final.style.position =
            "fixed";

        final.style.inset =
            "0";

        final.style.zIndex =
            "30";

        final.style.display =
            "flex";

        final.style.alignItems =
            "center";

        final.style.justifyContent =
            "center";

        final.style.textAlign =
            "center";

        final.style.padding =
            "30px";

        final.innerHTML = `

            <div style="
                font-size:clamp(35px,7vw,80px);
                text-shadow:
                0 0 10px white,
                0 0 30px #ff72c8,
                0 0 60px #ff00aa;
                animation:pular 1s infinite alternate;
            ">

                💗🐒💗<br>

                EU TE AMO<br>

                MAIS QUE TUDO!<br>

                💜🐒💜

                <div style="
                    font-size:25px;
                    margin-top:25px;
                ">
                    você é o amor da minha vida
                    e eu escolheria você
                    mil vezes. 🥹💕
                </div>

            </div>
        `;

        document.body.appendChild(final);

    },4000);
}

</script>

</body>
</html>
